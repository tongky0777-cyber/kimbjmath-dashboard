<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수경수학학원 김병진T 학부모 확인</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  /* 밝은 파스텔 팔레트 */
  --ink:#4a4a63;--ink2:#5f5f7a;--muted:#a0a0b8;--bg:#f6f4fb;--white:#ffffff;--line:#efecf7;
  --red:#e08a9a;--red-bg:#fdeef1;--green:#7ec9a8;--green-bg:#eafaf3;
  --gold:#e6b980;--gold-bg:#fdf5e9;--blue:#8fb8e8;--blue-bg:#eef4fc;
  --purple:#b39ddb;--purple-bg:#f3eefb;--mint:#8fd9c8;--mint-bg:#e8f9f4;
  --peach:#f5b7a8;--peach-bg:#fdefeb;--lav:#c3b0e8;--lav-bg:#f2edfb;
  --accent:#a89bd9;
  --shadow:0 4px 20px rgba(150,140,200,.12);
  --sans:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
body{font-family:var(--sans);background:linear-gradient(160deg,#f8f5fc 0%,#f2f6fb 100%);color:var(--ink);font-size:14px;line-height:1.6;min-height:100vh;}
.top-bar{background:linear-gradient(120deg,#b8a9e0 0%,#9fc4e8 100%);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 16px rgba(150,140,200,.2);}
.top-bar .logo{font-size:14px;font-weight:700;opacity:.97;letter-spacing:.02em;}
.top-bar .badge{font-size:10px;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:100px;margin-left:auto;font-weight:600;}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
.student-card{background:linear-gradient(135deg,#fbf9ff 0%,#f3f0fc 100%);border-radius:18px;padding:22px;margin-bottom:16px;border:1px solid var(--line);box-shadow:var(--shadow);}
.student-name{font-size:21px;font-weight:800;color:var(--ink);letter-spacing:-.01em;}
.student-meta{font-size:12px;color:var(--muted);margin-top:5px;}
.section{background:var(--white);border-radius:18px;padding:20px;margin-bottom:14px;border:1px solid var(--line);box-shadow:var(--shadow);}
.section-title{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.04em;margin-bottom:14px;display:flex;align-items:center;gap:7px;}
.section-title::before{content:'';display:inline-block;width:4px;height:14px;background:linear-gradient(var(--lav),var(--blue));border-radius:3px;}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat-box{background:var(--lav-bg);border-radius:14px;padding:14px 10px;text-align:center;}
.stat-box:nth-child(2){background:var(--mint-bg);}
.stat-box:nth-child(3){background:var(--peach-bg);}
.stat-val{font-size:23px;font-weight:800;color:var(--ink);}
.stat-label{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600;}
.hw-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
.hw-item:last-child{border-bottom:none;}
.hw-name{flex:1;font-size:13px;color:var(--ink2);}
.hw-due{font-size:11px;color:var(--muted);white-space:nowrap;}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;white-space:nowrap;}
.tag-pending{background:var(--red-bg);color:#c96b7d;}
.tag-done{background:var(--green-bg);color:#4a9d78;}
.tag-half{background:var(--gold-bg);color:#c99850;}
.test-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.test-item:last-child{border-bottom:none;}
.test-name{flex:1;font-size:13px;color:var(--ink2);font-weight:600;}
.test-score{font-size:17px;font-weight:800;}
.test-date{font-size:11px;color:var(--muted);}
.att-grid{display:flex;flex-wrap:wrap;gap:6px;}
.att-dot{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.att-o{background:var(--green-bg);color:#4a9d78;}
.att-x{background:var(--red-bg);color:#c96b7d;}
.att-e{background:var(--blue-bg);color:#5f8dc4;}
.att-t{background:var(--gold-bg);color:#c99850;}
.att-date{font-size:9px;text-align:center;color:var(--muted);margin-top:2px;}
.att-wrap{display:flex;flex-direction:column;align-items:center;}
.prog-item{padding:11px 0;border-bottom:1px solid var(--line);}
.prog-item:last-child{border-bottom:none;}
.prog-book{font-size:13px;font-weight:700;color:var(--ink);}
.prog-unit{font-size:12px;color:var(--ink2);margin-top:2px;}
.prog-meta{font-size:11px;color:var(--muted);margin-top:3px;}
.schedule-item{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
.schedule-item:last-child{border-bottom:none;}
.schedule-date{font-size:12px;font-weight:700;color:var(--purple);white-space:nowrap;min-width:52px;}
.schedule-info{flex:1;}
.schedule-content{font-size:13px;color:var(--ink2);}
.schedule-time{font-size:11px;color:var(--muted);margin-top:2px;}
.schedule-done{font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;white-space:nowrap;background:var(--green-bg);color:#4a9d78;}
.schedule-upcoming{font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;white-space:nowrap;background:var(--purple-bg);color:var(--purple);}
.empty{text-align:center;color:var(--muted);padding:20px;font-size:13px;}
.error-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:20px;}
.error-screen h2{font-size:18px;color:var(--ink);margin-bottom:8px;}
.error-screen p{font-size:13px;color:var(--muted);}
.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px;}
/* 점수 추이 그래프 */
.chart-wrap{background:linear-gradient(160deg,#faf8ff 0%,#f0f5fc 100%);border-radius:14px;padding:16px 8px 8px;margin-bottom:4px;}
.chart-svg{width:100%;height:auto;display:block;overflow:visible;}
.chart-legend{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;}
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>

<div class="top-bar">
  <div class="logo">수경수학학원 김병진T</div>
  <div class="badge">학부모 전용</div>
</div>

<div class="wrap" id="app">
  <div class="loading">불러오는 중..</div>
  </div>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyDfQxi6q8xVUVgnvwON446Lnd-Becpwvbk",
  authDomain: "kimbjmath.firebaseapp.com",
  databaseURL: "https://kimbjmath-default-rtdb.firebaseio.com",
  projectId: "kimbjmath",
  storageBucket: "kimbjmath.firebasestorage.app",
  messagingSenderId: "664889936709",
  appId: "1:664889936709:web:2df1494b0cd978c64e4c2c"
};
firebase.initializeApp(firebaseConfig);
var rtdb = firebase.database();
// 익명 로그인: Firebase 보안 규칙이 인증을 요구하므로 데이터 접근 전 로그인 필요
window._authReady = (firebase.auth ? firebase.auth().signInAnonymously()
  .then(function(){ return true; })
  .catch(function(e){ console.warn('익명 로그인 실패:', e); return false; })
  : Promise.resolve(false));

function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

function render(){
  var sid = getParam('id');
  var app = document.getElementById('app');

  if(!sid){
    app.innerHTML = '<div class="error-screen"><h2>학생이 없습니다</h2><p>학부모 링크를 다시 확인해주세요.</p></div>';
    return;
  }

  var keys = ['students','attendance','homework','tests','schedules','progress'];
  var data = {};
  var loaded = 0;

  // 익명 로그인 완료 후 데이터 읽기 (인증 전에 읽으면 permission_denied)
  Promise.resolve(window._authReady).then(function(){
    keys.forEach(function(key){
      rtdb.ref('bjm_' + key).once('value', function(snap){
        var val = snap.val();
        if(!val){
          data[key] = [];
        } else if(Array.isArray(val)){
          data[key] = val;
        } else if(typeof val === 'object'){
          data[key] = Object.values(val);
        } else {
          data[key] = [];
        }
        loaded++;
        if(loaded === keys.length) renderData(sid, data, app);
      }, function(err){
        data[key] = [];
        loaded++;
        if(loaded === keys.length) renderData(sid, data, app);
      });
    });
  });
}

// SVG 꺾은선 그래프 생성 (테스트 점수 추이)
// items: [{name, score, date}] 시간순(오래된→최신)
function buildScoreChart(items){
  if(!items.length) return '';
  var W=600, H=240, padL=38, padR=18, padT=24, padB=42;
  var plotW=W-padL-padR, plotH=H-padT-padB;
  var n=items.length;
  function xAt(i){ return n===1 ? padL+plotW/2 : padL + plotW*i/(n-1); }
  function yAt(v){ var vv=Math.max(0,Math.min(100,v)); return padT + plotH*(1 - vv/100); }
  var svg='<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';
  var lines=[{v:100},{v:75},{v:50},{v:25},{v:0}];
  lines.forEach(function(g){
    var y=yAt(g.v);
    svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#e6e0f2" stroke-width="1" '+(g.v%50!==0?'stroke-dasharray="3 4"':'')+'/>';
    svg+='<text x="'+(padL-8)+'" y="'+(y+4)+'" font-size="11" fill="#b0aac4" text-anchor="end">'+g.v+'</text>';
  });
  svg+='<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="#b8a9e0" stop-opacity="0.35"/>'
    +'<stop offset="100%" stop-color="#9fc4e8" stop-opacity="0.02"/></linearGradient>'
    +'<linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">'
    +'<stop offset="0%" stop-color="#b39ddb"/><stop offset="100%" stop-color="#8fb8e8"/></linearGradient></defs>';
  var linePath='', areaPath='';
  items.forEach(function(t,i){
    var x=xAt(i), y=yAt(t.score);
    linePath += (i===0?'M':'L')+x+' '+y+' ';
  });
  areaPath = linePath + 'L'+xAt(n-1)+' '+yAt(0)+' L'+xAt(0)+' '+yAt(0)+' Z';
  svg+='<path d="'+areaPath+'" fill="url(#areaGrad)"/>';
  svg+='<path d="'+linePath+'" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
  items.forEach(function(t,i){
    var x=xAt(i), y=yAt(t.score);
    svg+='<circle cx="'+x+'" cy="'+y+'" r="5.5" fill="#fff" stroke="#a89bd9" stroke-width="2.5"/>';
    var above = y>padT+22;
    var ly = above ? y-12 : y+20;
    svg+='<text x="'+x+'" y="'+ly+'" font-size="12.5" font-weight="700" fill="#7a6ca8" text-anchor="middle">'+t.score+'</text>';
    var md=(t.date||'').slice(5).replace('-','.');
    svg+='<text x="'+x+'" y="'+(H-padB+22)+'" font-size="10" fill="#b0aac4" text-anchor="middle">'+md+'</text>';
  });
  svg+='</svg>';
  return '<div class="chart-wrap">'+svg+'</div>';
}

function renderData(sid, data, app){
  var students = data.students || [];
  var student = students.find(function(s){ return s && String(s.id) === String(sid); });

  if(!student){
    app.innerHTML = '<div class="error-screen"><h2>학생 정보를 찾을 수 없습니다</h2><p>링크가 올바른지 확인해주세요.</p></div>';
    return;
  }

  // id 타입 불일치 방지: 이후 모든 기록 조회는 문자열 기준으로 통일
  sid = String(student.id);

  var threeMonthsAgo = new Date();
  threeMonthsAgo.setMonth(threeMonthsAgo.getMonth() - 3);
  var threeMonthsAgoStr = threeMonthsAgo.toISOString().slice(0,10);
  var today = new Date().toISOString().slice(0,10);

  var attendance = (data.attendance || []).filter(function(a){ return a && String(a.sid) === sid && a.date >= threeMonthsAgoStr; }).sort(function(a,b){ return b.date.localeCompare(a.date); });
  var homework = (data.homework || []).filter(function(h){ return h && String(h.sid) === sid; }).sort(function(a,b){ return b.due.localeCompare(a.due); });
  var tests = (data.tests || []).filter(function(t){ return t && String(t.sid) === sid; }).sort(function(a,b){ return b.date.localeCompare(a.date); });

  // 최근 진도 2개
  var progress = (data.progress || []).filter(function(p){
    return p && String(p.sid) === sid;
  }).sort(function(a,b){ return b.date.localeCompare(a.date); }).slice(0,2);

  // 보강 일정: target이 학생 이름과 일치하는 것
  var schedules = (data.schedules || []).filter(function(s){
    return s && s.target && s.target.indexOf(student.name) !== -1;
  }).sort(function(a,b){ return b.date.localeCompare(a.date); });

  var attO = attendance.filter(function(a){ return a.status==='O'; }).length;
  var hwDone = homework.filter(function(h){ return h.status==='done'; }).length;
  var testAvg = tests.length ? Math.round(tests.reduce(function(s,t){ return s+t.score; },0)/tests.length) : null;

  var attStatusLabel = {O:'출석',X:'결석',E:'조퇴',T:'지각',B:'보강'};
  var attStatusClass = {O:'att-o',X:'att-x',E:'att-e',T:'att-t',B:'att-t'};
  var hwStatusLabel = {pending:'미제출',done:'제출',half:'일부제출'};
  var hwStatusClass = {pending:'tag-pending',done:'tag-done',half:'tag-half'};

  // (월간 리포트 관련 계산 제거됨)

  var html = '';

  // 학생 카드
  html += '<div class="student-card">'
    + '<div class="student-name">'+student.name+'</div>'
    + '<div class="student-meta">'+student.grade+' · '+(student.school||'')+(student.class?' · '+student.class:'')+'</div>'
    + '</div>';

  // (월간 리포트 섹션 제거됨)

  // 요약 통계
  html += '<div class="section">'
    + '<div class="section-title">요약</div>'
    + '<div class="stat-row">'
    + '<div class="stat-box"><div class="stat-val">'+attO+'</div><div class="stat-label">출석 (3개월)</div></div>'
    + '<div class="stat-box"><div class="stat-val">'+hwDone+'</div><div class="stat-label">제출 숙제</div></div>'
    + '<div class="stat-box"><div class="stat-val">'+(testAvg!==null?testAvg+'점':'–')+'</div><div class="stat-label">평균 점수</div></div>'
    + '</div>'
    + '</div>';

  // 최근 진도
  html += '<div class="section"><div class="section-title">최근 진도</div>';
  if(!progress.length){
    html += '<div class="empty">진도 데이터가 없습니다</div>';
  } else {
    progress.forEach(function(p){
      html += '<div class="prog-item">'
        + '<div class="prog-book">'+p.book+(p.unit?' · '+p.unit:'')+'</div>'
        + (p.range?'<div class="prog-unit">범위: '+p.range+'</div>':'')
        + '<div class="prog-meta">'+p.date+(p.groupName?' · '+p.groupName:'')+'</div>'
        + '</div>';
    });
  }
  html += '</div>';

  // 보강 일정
  html += '<div class="section"><div class="section-title">보강 일정</div>';
  if(!schedules.length){
    html += '<div class="empty">보강 일정이 없습니다</div>';
  } else {
    schedules.slice(0,10).forEach(function(s){
      var isDone = s.done || s.date < today;
      var statusTag = isDone
        ? '<span class="schedule-done">완료</span>'
        : '<span class="schedule-upcoming">예정</span>';
      html += '<div class="schedule-item">'
        + '<div class="schedule-date">'+s.date.slice(5)+'</div>'
        + '<div class="schedule-info">'
        + '<div class="schedule-content">'+(s.content||'보강')+'</div>'
        + (s.time ? '<div class="schedule-time">'+s.time+'</div>' : '')
        + '</div>'
        + statusTag
        + '</div>';
    });
  }
  html += '</div>';

  // 출결
  html += '<div class="section"><div class="section-title">출결 현황</div>';
  if(!attendance.length){
    html += '<div class="empty">출결 데이터가 없습니다</div>';
  } else {
    html += '<div class="att-grid">';
    attendance.slice(0,30).forEach(function(a){
      html += '<div class="att-wrap">'
        + '<div class="att-dot '+(attStatusClass[a.status]||'att-o')+'">'+(attStatusLabel[a.status]||a.status)+'</div>'
        + '<div class="att-date">'+a.date.slice(5)+'</div>'
        + '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  // 숙제
  html += '<div class="section"><div class="section-title">숙제 현황</div>';
  if(!homework.length){
    html += '<div class="empty">숙제 데이터가 없습니다</div>';
  } else {
    homework.slice(0,10).forEach(function(h){
      html += '<div class="hw-item">'
        + '<div class="hw-name">'+h.name+'</div>'
        + '<div class="hw-due">마감 '+h.due.slice(5)+'</div>'
        + '<span class="tag '+(hwStatusClass[h.status]||'tag-pending')+'">'+(hwStatusLabel[h.status]||'미제출')+'</span>'
        + '</div>';
    });
  }
  html += '</div>';

  // 테스트
  html += '<div class="section"><div class="section-title">테스트 결과</div>';
  if(!tests.length){
    html += '<div class="empty">테스트 데이터가 없습니다</div>';
  } else {
    // 점수 추이 그래프 (시간순: 오래된→최신). score가 숫자인 것만.
    var chartData = tests.slice().filter(function(t){ return typeof t.score==='number' || !isNaN(parseFloat(t.score)); })
      .map(function(t){ return {name:t.name, score:Math.round(parseFloat(t.score)), date:t.date}; })
      .sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
    if(chartData.length>=1){
      html += buildScoreChart(chartData);
      html += '<div class="chart-legend">최근 점수 추이 (100점 만점 기준)</div>';
    }
    // 목록 (최신순)
    tests.forEach(function(t){
      var scoreColor = t.score>=90?'var(--green)':t.score>=70?'var(--gold)':'#c96b7d';
      html += '<div class="test-item">'
        + '<div class="test-name">'+t.name+'</div>'
        + '<div style="text-align:right;">'
        + '<div class="test-score" style="color:'+scoreColor+'">'+t.score+'점</div>'
        + '<div class="test-date">'+t.date+'</div>'
        + '</div>'
        + '</div>';
    });
  }
  html += '</div>';

  app.innerHTML = html;
}

render();

// (AI 리포트 자동생성 기능 제거됨 — 선생님이 대시보드에서 저장한 리포트만 표시)
</script>
</body>
</html>
