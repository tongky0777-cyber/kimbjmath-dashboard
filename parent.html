<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>김병진T 학부모 포털</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#273c36;--ink2:#4f625d;--muted:#8aa09a;--line:#dcebe7;--bg:#f4faf8;--bg2:#e9f6f2;
  --white:#fff;--teal:#168f7a;--teal2:#0f7766;--red:#d85b67;--red-bg:#fdebed;
  --gold:#c59034;--gold-bg:#fff5df;--blue:#3478c9;--blue-bg:#eaf3ff;--shadow:0 14px 36px rgba(30,90,78,.12);
  --sans:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
body{font-family:var(--sans);background:linear-gradient(155deg,#edf8f5 0%,#f8fbfa 55%,#fff8ec 100%);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.55}
button,input,select,textarea{font-family:var(--sans)}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:10px}
.brand{font-weight:900;font-size:17px;color:var(--teal2)}
.chip{margin-left:auto;background:var(--bg2);color:var(--teal2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 60px}
.login{max-width:430px;margin:8vh auto 0;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:28px;box-shadow:var(--shadow)}
.login h1{font-size:22px;margin-bottom:8px;color:var(--ink)}
.login p{color:var(--muted);font-size:13px;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:900;color:var(--ink2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fbfffd;padding:12px;font-size:15px;color:var(--ink);outline:none}
.field textarea{min-height:94px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(22,143,122,.1)}
.btn{border:0;border-radius:8px;background:var(--teal);color:#fff;font-weight:900;padding:12px 14px;cursor:pointer}
.btn:hover{background:var(--teal2)}
.btn.sec{background:var(--bg2);color:var(--teal2);border:1px solid var(--line)}
.btn.danger{background:var(--red-bg);color:var(--red);border:1px solid #f6cbd0}
.msg{font-size:13px;color:var(--red);min-height:20px;margin-top:10px}
.hero{display:flex;gap:16px;align-items:stretch;margin-bottom:16px}
.student{flex:1;background:linear-gradient(135deg,#128872,#2aa991);color:#fff;border-radius:10px;padding:22px;box-shadow:var(--shadow)}
.student h1{font-size:24px;margin-bottom:6px}
.student p{opacity:.9;font-size:13px}
.summary{width:280px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow)}
.summary b{font-size:24px;color:var(--teal)}
.summary div{font-size:12px;color:var(--muted);font-weight:800}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}
.card{background:var(--white);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.card-hd{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fbfffd}
.card-hd h2{font-size:16px;color:var(--ink)}
.card-bd{padding:17px}
.group{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fbfffd}
.group-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.group b{font-size:14px}
.group small{color:var(--muted)}
.notice{font-size:12px;margin-top:8px;padding:8px 10px;border-radius:7px;background:var(--bg2);color:var(--teal2)}
.notice.blocked{background:var(--red-bg);color:var(--red)}
.notice.ask{background:var(--gold-bg);color:var(--gold)}
.list-item{border-bottom:1px solid var(--line);padding:12px 0}
.list-item:last-child{border-bottom:0}
.status{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:900}
.st-pending{background:var(--gold-bg);color:var(--gold)}
.st-approved,.st-done{background:var(--bg2);color:var(--teal2)}
.st-adjusting{background:var(--blue-bg);color:var(--blue)}
.st-rejected{background:var(--red-bg);color:var(--red)}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none!important}
@media(max-width:760px){
  .hero,.grid{display:block}
  .summary{width:auto;margin-top:12px}
  .card{margin-bottom:14px}
  .row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="top">
  <div class="top-in">
    <div class="brand">김병진T 학부모 포털</div>
    <div class="chip" id="top-chip">보강 신청</div>
  </div>
</div>

<main class="wrap">
  <section class="login" id="login-panel">
    <h1>학부모 접속</h1>
    <p>선생님이 안내한 접속코드를 입력하면 자녀의 보강 신청 화면으로 들어갑니다.</p>
    <div class="field">
      <label for="code">접속코드</label>
      <input id="code" autocomplete="one-time-code" inputmode="text" placeholder="예: A7K2M9Q4">
    </div>
    <button class="btn" style="width:100%" onclick="login()">들어가기</button>
    <div class="msg" id="login-msg"></div>
  </section>

  <section id="app-panel" class="hidden">
    <div class="hero">
      <div class="student">
        <h1 id="student-name">학생</h1>
        <p id="student-meta"></p>
      </div>
      <div class="summary">
        <b id="pending-count">0</b>
        <div>승인 대기 신청</div>
        <button class="btn sec" style="width:100%;margin-top:14px" onclick="logout()">나가기</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-hd"><h2>결석·보강 신청</h2></div>
        <div class="card-bd">
          <div class="field">
            <label for="group">결석 예정 수업</label>
            <select id="group" onchange="onGroupChange()"></select>
          </div>
          <div id="policy-note" class="notice"></div>
          <div class="row" style="margin-top:14px">
            <div class="field">
              <label for="absent-date">결석 예정일</label>
              <input id="absent-date" type="date">
            </div>
            <div class="field">
              <label for="slot">희망 보강 시간</label>
              <select id="slot"></select>
            </div>
          </div>
          <div class="field">
            <label for="custom-time">직접 희망 시간</label>
            <input id="custom-time" placeholder="가능한 시간이 없으면 입력해 주세요">
          </div>
          <div class="field">
            <label for="reason">결석 사유</label>
            <textarea id="reason" placeholder="예: 학교 행사, 병원 진료 등"></textarea>
          </div>
          <button class="btn" style="width:100%" onclick="submitRequest()">신청 보내기</button>
          <div class="msg" id="submit-msg"></div>
        </div>
      </div>

      <div>
        <div class="card" style="margin-bottom:16px">
          <div class="card-hd"><h2>수강 중인 수업</h2></div>
          <div class="card-bd" id="group-list"></div>
        </div>
        <div class="card">
          <div class="card-hd"><h2>신청 내역</h2><button class="btn sec" onclick="loadData()">새로고침</button></div>
          <div class="card-bd" id="request-list"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
var state = { token:'', student:null, groups:[], slots:[], requests:[] };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function today(){ return new Date().toISOString().slice(0,10); }

function post(url, body){
  return fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if(!r.ok || !j.ok) throw new Error(j.error || '요청을 처리하지 못했습니다');
      return j;
    });
  });
}

function login(){
  var code = $('code').value.trim();
  $('login-msg').textContent = '';
  if(!code){ $('login-msg').textContent = '접속코드를 입력해 주세요.'; return; }
  post('/api/parent-auth', { action:'login', code:code }).then(function(data){
    state.token = data.token;
    state.student = data.student;
    state.groups = data.groups || [];
    localStorage.setItem('kbjm_parent_token', state.token);
    showApp();
    loadData();
  }).catch(function(err){
    $('login-msg').textContent = '접속코드를 확인해 주세요.';
  });
}

function logout(){
  localStorage.removeItem('kbjm_parent_token');
  state = { token:'', student:null, groups:[], slots:[], requests:[] };
  $('app-panel').classList.add('hidden');
  $('login-panel').classList.remove('hidden');
}

function showApp(){
  $('login-panel').classList.add('hidden');
  $('app-panel').classList.remove('hidden');
  $('student-name').textContent = (state.student && state.student.name || '') + ' 학생';
  $('student-meta').textContent = [state.student && state.student.grade, state.student && state.student.school].filter(Boolean).join(' · ');
  $('absent-date').value = today();
  renderGroups();
}

function loadData(){
  if(!state.token) return;
  return post('/api/parent-makeup', { action:'snapshot', token:state.token }).then(function(data){
    state.student = data.student || state.student;
    state.groups = data.groups || [];
    state.slots = data.slots || [];
    state.requests = data.requests || [];
    showApp();
    renderRequests();
    onGroupChange();
  }).catch(function(err){
    logout();
  });
}

function renderGroups(){
  var sel = $('group');
  var allowed = state.groups.filter(function(g){ return g.makeupPolicy !== 'blocked'; });
  sel.innerHTML = state.groups.length
    ? state.groups.map(function(g){ return '<option value="'+esc(g.id)+'">'+esc(g.name || '수업')+(g.subject?' · '+esc(g.subject):'')+'</option>'; }).join('')
    : '<option value="">수업 정보 없음</option>';
  if(allowed.length && (!sel.value || state.groups.find(function(g){ return g.id === sel.value && g.makeupPolicy === 'blocked'; }))){
    sel.value = allowed[0].id;
  }
  $('group-list').innerHTML = state.groups.length ? state.groups.map(function(g){
    var cls = g.makeupPolicy === 'blocked' ? 'blocked' : (g.makeupPolicy === 'ask' ? 'ask' : '');
    var note = g.makeupPolicy === 'blocked' ? (g.makeupNote || '이 수업은 보강 신청 대상이 아닙니다.')
      : g.makeupPolicy === 'ask' ? (g.makeupNote || '선생님 확인 후 보강 가능 여부가 결정됩니다.')
      : (g.makeupNote || '보강 신청이 가능한 수업입니다.');
    return '<div class="group"><div class="group-top"><b>'+esc(g.name || '수업')+'</b><small>'+esc([g.subject,(g.days||[]).join(','),g.time].filter(Boolean).join(' · '))+'</small></div><div class="notice '+cls+'">'+esc(note)+'</div></div>';
  }).join('') : '<div class="empty">등록된 수업 정보가 없습니다.</div>';
}

function onGroupChange(){
  var group = state.groups.find(function(g){ return g.id === $('group').value; });
  var note = $('policy-note');
  if(!group){
    note.textContent = '수업을 선택해 주세요.';
    note.className = 'notice';
    $('slot').innerHTML = '<option value="">가능한 시간 없음</option>';
    return;
  }
  var blocked = group.makeupPolicy === 'blocked';
  note.className = 'notice ' + (blocked ? 'blocked' : group.makeupPolicy === 'ask' ? 'ask' : '');
  note.textContent = blocked ? (group.makeupNote || '이 수업은 보강 신청 대상이 아닙니다.')
    : group.makeupPolicy === 'ask' ? (group.makeupNote || '선생님 확인 후 보강 가능 여부가 결정됩니다.')
    : (group.makeupNote || '보강 신청이 가능한 수업입니다.');
  var slots = state.slots.filter(function(s){
    if(s.scope === 'subject') return !s.subject || s.subject === group.subject;
    return true;
  });
  $('slot').innerHTML = '<option value="">직접 희망 시간 입력</option>' + slots.map(function(s){
    return '<option value="'+esc(s.id)+'">'+esc(s.label || ((s.date||'')+' '+(s.start||'')))+'</option>';
  }).join('');
}

function statusLabel(s){
  return { pending:'승인 대기', adjusting:'시간 조정', rejected:'반려', approved:'확정', done:'완료' }[s] || '승인 대기';
}

function renderRequests(){
  var pending = state.requests.filter(function(r){ return r.status === 'pending'; }).length;
  $('pending-count').textContent = pending;
  $('request-list').innerHTML = state.requests.length ? state.requests.slice().sort(function(a,b){
    return (b.createdAt || '').localeCompare(a.createdAt || '');
  }).map(function(r){
    return '<div class="list-item"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>'+esc(r.groupName || '수업')+'</b><span class="status st-'+esc(r.status || 'pending')+'">'+statusLabel(r.status)+'</span></div>'
      + '<div style="font-size:12px;color:var(--muted);margin-top:4px">결석 '+esc(r.absentDate || '')+' · 희망 '+esc(r.requestedSlotLabel || r.customTime || '')+'</div>'
      + (r.finalDate ? '<div class="notice" style="margin-top:8px">확정: '+esc(r.finalDate+' '+(r.finalTime||''))+'</div>' : '')
      + '</div>';
  }).join('') : '<div class="empty">아직 신청 내역이 없습니다.</div>';
}

function submitRequest(){
  var group = state.groups.find(function(g){ return g.id === $('group').value; });
  $('submit-msg').textContent = '';
  if(!group){ $('submit-msg').textContent = '수업을 선택해 주세요.'; return; }
  if(group.makeupPolicy === 'blocked'){ $('submit-msg').textContent = '이 수업은 보강 신청 대상이 아닙니다.'; return; }
  var body = {
    action:'submit',
    token:state.token,
    groupId:$('group').value,
    absentDate:$('absent-date').value,
    slotId:$('slot').value,
    customTime:$('custom-time').value,
    reason:$('reason').value
  };
  post('/api/parent-makeup', body).then(function(){
    $('submit-msg').style.color = 'var(--teal2)';
    $('submit-msg').textContent = '신청이 접수되었습니다. 선생님 승인 후 확정됩니다.';
    $('custom-time').value = '';
    $('reason').value = '';
    loadData();
  }).catch(function(err){
    $('submit-msg').style.color = 'var(--red)';
    $('submit-msg').textContent = err.message || '신청을 보내지 못했습니다.';
  });
}

document.addEventListener('DOMContentLoaded', function(){
  var token = localStorage.getItem('kbjm_parent_token') || '';
  if(token){
    state.token = token;
    loadData();
  }
  $('code').addEventListener('keydown', function(e){ if(e.key === 'Enter') login(); });
});
</script>
</body>
</html>
