<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>김병진 수학연구소 · 모바일</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#1a1a2e;--red:#c0392b;--red-bg:#fdf0ef;
  --ink:#1a1a2e;--ink2:#3a3a5c;--muted:#888;--bg:#f7f7fa;--white:#fff;--line:#e8e8f0;
  --green:#1a6b3a;--green-bg:#edf7f1;--blue:#1c3c6e;--blue-bg:#eef3fb;
  --gold:#8a6820;--gold-bg:#fdf8ee;
  --sans:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;padding-bottom:80px;}

/* 상단 헤더 */
.header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-title{font-size:15px;font-weight:700;}
.header-date{font-size:11px;opacity:.6;}

/* 하단 탭바 */
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--line);display:flex;z-index:100;}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px;cursor:pointer;color:var(--muted);font-size:10px;gap:3px;transition:.15s;}
.tab-item.active{color:var(--navy);}
.tab-item .icon{font-size:20px;}

/* 뷰 */
.view{display:none;padding:16px;}
.view.active{display:block;}

/* 카드 */
.card{background:var(--white);border-radius:10px;border:1px solid var(--line);margin-bottom:12px;overflow:hidden;}
/* 달력 */
.cal-wrap{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 6px;margin-bottom:12px;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding:0 4px;}
.cal-nav button{background:none;border:none;font-size:22px;line-height:1;padding:2px 16px;cursor:pointer;color:var(--navy);}
.cal-title{font-size:15px;font-weight:700;color:var(--navy);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.cal-dow{text-align:center;font-size:11px;color:var(--muted);padding:3px 0;}
.cal-cell{position:relative;height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;border-radius:8px;cursor:pointer;color:var(--ink);line-height:1.15;box-sizing:border-box;}
.cal-cell.empty{visibility:hidden;}
.cal-cell.has{font-weight:700;}
.cal-cell .dot{width:5px;height:5px;border-radius:50%;background:var(--navy);margin-top:2px;}
.cal-cell.sel{background:var(--navy);color:#fff;}
.cal-cell.sel .dot{background:#fff;}
.cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--navy);}
.cal-detail-date{font-size:13px;font-weight:700;color:var(--navy);margin:4px 2px 8px;}
.card-header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:13px;font-weight:700;}
.card-body{padding:12px 14px;}

/* 검색 */
.search-box{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:10px 14px;width:100%;font-size:13px;font-family:var(--sans);outline:none;margin-bottom:12px;}
.search-box:focus{border-color:var(--navy);}

/* 학생 카드 */
.student-item{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
.student-item:active{background:var(--bg);}
.student-name{font-size:14px;font-weight:700;margin-bottom:4px;}
.student-meta{font-size:12px;color:var(--muted);}
.student-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.tag{font-size:11px;padding:2px 8px;border-radius:3px;font-weight:700;}
.tag-red{background:var(--red-bg);color:var(--red);}
.tag-green{background:var(--green-bg);color:var(--green);}
.tag-blue{background:var(--blue-bg);color:var(--blue);}

/* 보강 */
.makeup-item{padding:12px 0;border-bottom:1px solid var(--line);}
.makeup-item:last-child{border-bottom:none;}
.makeup-date{font-size:12px;color:var(--muted);margin-bottom:4px;}
.makeup-name{font-size:13px;font-weight:700;}
.makeup-status{font-size:11px;padding:2px 8px;border-radius:3px;font-weight:700;}
.status-done{background:var(--green-bg);color:var(--green);}
.status-plan{background:var(--blue-bg);color:var(--blue);}

/* 시간표 */
.tt-day{margin-bottom:14px;}
.tt-day-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;padding:4px 0;border-bottom:1px solid var(--line);}
.tt-class-card{border-radius:8px;padding:10px 12px;margin-bottom:6px;border-left:4px solid;}
.tt-class-name{font-size:13px;font-weight:700;}
.tt-class-info{font-size:11px;margin-top:3px;opacity:.8;}

/* 시험일정 */
.exam-item{padding:12px 0;border-bottom:1px solid var(--line);}
.exam-item:last-child{border-bottom:none;}
.exam-school{font-size:13px;font-weight:700;margin-bottom:3px;}
.exam-date{font-size:12px;color:var(--muted);}
.exam-type{font-size:11px;padding:2px 8px;border-radius:3px;font-weight:700;display:inline-block;margin-top:4px;}

/* 플래너 */
.planner-day{margin-bottom:14px;}
.planner-day-title{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.planner-day-date{font-size:11px;color:var(--muted);font-weight:400;}
.planner-event{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:6px;border-left:4px solid var(--navy);}
.planner-event-title{font-size:13px;font-weight:700;}
.planner-event-meta{font-size:11px;color:var(--muted);margin-top:2px;}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:.2s;}
.modal-bg.open{opacity:1;pointer-events:all;}
.modal{background:var(--white);border-radius:16px 16px 0 0;padding:20px 16px;width:100%;max-height:80vh;overflow-y:auto;}
.modal-handle{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 16px;}
.modal-name{font-size:17px;font-weight:700;margin-bottom:6px;}
.modal-meta{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.8;}
.modal-section{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;margin-top:12px;text-transform:uppercase;letter-spacing:.05em;}
.modal-close{width:100%;background:var(--bg);border:none;border-radius:8px;padding:12px;font-size:13px;font-family:var(--sans);cursor:pointer;margin-top:16px;color:var(--ink);}

.empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 0;}
.section-title{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--ink2);}
.badge{background:var(--navy);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">🧮 김병진 수학연구소</div>
    <div class="header-date" id="today-label"></div>
  </div>
</div>

<!-- 전체현황 -->
<div class="view active" id="view-overview">
  <div id="overview-body"></div>
</div>

<!-- 학생 조회 -->
<div class="view" id="view-students">
  <input class="search-box" type="text" placeholder="학생 이름 검색..." oninput="searchStudents(this.value)">
  <div id="student-list"></div>
</div>

<!-- 출석 -->
<div class="view" id="view-attendance">
  <div id="attendance-body"></div>
</div>

<!-- 테스트 -->
<div class="view" id="view-tests">
  <div id="tests-body"></div>
</div>

<!-- 보강 -->
<div class="view" id="view-makeup">
  <div class="section-title">예정된 보강</div>
  <div class="card">
    <div class="card-body" id="makeup-plan-list"></div>
  </div>
  <div class="section-title">완료된 보강</div>
  <div class="card">
    <div class="card-body" id="makeup-done-list"></div>
  </div>
</div>

<!-- 시간표 -->
<div class="view" id="view-timetable">
  <div id="tt-list"></div>
</div>

<!-- 시험일정 -->
<div class="view" id="view-exam">
  <div class="card">
    <div class="card-header"><span class="card-title">📅 시험 일정</span></div>
    <div class="card-body" id="exam-list"></div>
  </div>
</div>

<!-- 플래너 -->
<div class="view" id="view-planner">
  <div id="planner-list"></div>
</div>

<!-- 하단 탭바 -->
<div class="tab-bar">
  <div class="tab-item active" onclick="switchTab('overview',this)"><div class="icon">📊</div>전체현황</div>
  <div class="tab-item" onclick="switchTab('students',this)"><div class="icon">👥</div>학생</div>
  <div class="tab-item" onclick="switchTab('attendance',this)"><div class="icon">✅</div>출석</div>
  <div class="tab-item" onclick="switchTab('tests',this)"><div class="icon">📝</div>테스트</div>
  <div class="tab-item" onclick="switchTab('planner',this)"><div class="icon">🗓️</div>플래너</div>
</div>

<!-- 학생 상세 모달 -->
<div class="modal-bg" id="student-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-name" id="m-name"></div>
    <div class="modal-meta" id="m-meta"></div>
    <div class="modal-section">소속 반</div>
    <div id="m-groups"></div>
    <div class="modal-section">최근 출결</div>
    <div id="m-att"></div>
    <div class="modal-section">미제출 숙제</div>
    <div id="m-hw"></div>
    <button class="modal-close" onclick="closeModal()">닫기</button>
  </div>
</div>

<script>
var today = new Date();
var DAYS = ['일','월','화','수','목','금','토'];
var DAY_ORDER = ['월','화','수','목','금','토','일'];

document.getElementById('today-label').textContent =
  today.getFullYear()+'년 '+(today.getMonth()+1)+'월 '+today.getDate()+'일 '+DAYS[today.getDay()]+'요일';

var _cache={};
function get(key){ return _cache[key]||[]; }
function loadFromFirebase(){
  var FBCONFIG={apiKey:"AIzaSyDfQxi6q8xVUVgnvwON446Lnd-Becpwvbk",databaseURL:"https://kimbjmath-default-rtdb.firebaseio.com",projectId:"kimbjmath",appId:"1:664889936709:web:2df1494b0cd978c64e4c2c"};
  if(!firebase.apps.length)firebase.initializeApp(FBCONFIG);
  var db=firebase.database();
  var keys=["bjm_students","bjm_attendance","bjm_homework","bjm_tests","bjm_progress","bjm_groups","bjm_schedules","bjm_exams","tt_classes","planner_events"];
  function doLoad(){
    var loaded=0;
    keys.forEach(function(k){
      db.ref(k).once('value',function(snap){
        var val=snap.val();
        if(Array.isArray(val)) _cache[k]=val.filter(Boolean);
        else if(val && typeof val==='object') _cache[k]=Object.values(val).filter(Boolean);
        else _cache[k]=[];
        loaded++;
        if(loaded===keys.length){
          renderAll();
        }
      }, function(err){ // 읽기 실패해도 카운트 진행 (일부만 막혀도 나머지는 표시)
        _cache[k]=[]; loaded++; if(loaded===keys.length){ renderAll(); }
      });
    });
  }
  // 보안 규칙이 '로그인 필수'라서, 익명 로그인 후에 읽어야 데이터가 나온다
  if(firebase.auth){
    firebase.auth().signInAnonymously().then(doLoad).catch(function(e){ console.error('익명 로그인 실패:', e&&e.code, e&&e.message); doLoad(); });
  } else { doLoad(); }
}
function renderAll(){
  renderOverview();
  renderStudents('');
  renderAttendance();
  renderTests();
  renderPlanner();
}
  function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function switchTab(name, el){
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
  document.querySelectorAll('.tab-item').forEach(function(t){ t.classList.remove('active'); });
  document.getElementById('view-'+name).classList.add('active');
  el.classList.add('active');
  if(name==='overview') renderOverview();
  if(name==='students') renderStudents('');
  if(name==='attendance') renderAttendance();
  if(name==='tests') renderTests();
  if(name==='planner') renderPlanner();
}

// 재원생 판정 (퇴원·반이동 제외)
function isActive(s){ return s && s.status!=='withdrawn' && s.status!=='moved' && !s.withdrawn && !s.left; }

// ===== 공용 달력 =====
var _cal = {
  attendance:{ y:today.getFullYear(), m:today.getMonth(), sel:fmt(today) },
  tests:{ y:today.getFullYear(), m:today.getMonth(), sel:fmt(today) },
  planner:{ y:today.getFullYear(), m:today.getMonth(), sel:fmt(today) }
};
function moveCalMonth(kind,dir){ var c=_cal[kind]; var d=new Date(c.y,c.m+dir,1); c.y=d.getFullYear(); c.m=d.getMonth(); rerenderCal(kind); }
function pickCal(kind,ds){ _cal[kind].sel=ds; rerenderCal(kind); }
function rerenderCal(kind){ if(kind==='attendance')renderAttendance(); else if(kind==='tests')renderTests(); else if(kind==='planner')renderPlanner(); }
// markSet: {'YYYY-MM-DD':true} 데이터 있는 날 표시
function buildCalendar(kind, markSet){
  var c=_cal[kind], y=c.y, m=c.m, sel=c.sel;
  var startDow=new Date(y,m,1).getDay();
  var daysIn=new Date(y,m+1,0).getDate();
  var todayStr=fmt(new Date());
  var dows=['일','월','화','수','목','금','토'];
  var h='<div class="cal-wrap"><div class="cal-nav">'
    +'<button onclick="moveCalMonth(\''+kind+'\',-1)">‹</button>'
    +'<span class="cal-title">'+y+'년 '+(m+1)+'월</span>'
    +'<button onclick="moveCalMonth(\''+kind+'\',1)">›</button></div>';
  h+='<div class="cal-grid">'+dows.map(function(d){return '<div class="cal-dow">'+d+'</div>';}).join('');
  for(var i=0;i<startDow;i++) h+='<div class="cal-cell empty"></div>';
  for(var d=1;d<=daysIn;d++){
    var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var cls='cal-cell'+(markSet[ds]?' has':'')+(ds===sel?' sel':'')+(ds===todayStr?' today':'');
    h+='<div class="'+cls+'" onclick="pickCal(\''+kind+'\',\''+ds+'\')">'+d+(markSet[ds]?'<span class="dot"></span>':'')+'</div>';
  }
  h+='</div></div>';
  return h;
}
function _dowLabel(ds){ var d=new Date(ds+'T00:00:00'); return ds+' ('+DAYS[d.getDay()]+')'; }
var STATUS_MAP={'O':'출석','X':'결석','T':'지각','B':'보강','E':'조퇴'};
function statusColor(st){ return st==='O'||st==='B'?'var(--green)':st==='X'?'var(--red)':'var(--gold)'; }

// ===== 전체현황 =====
function renderOverview(){
  var students = get('bjm_students').filter(isActive);
  var att = get('bjm_attendance');
  var hw = get('bjm_homework');
  var schedules = get('bjm_schedules').filter(function(s){ return s.type==='보강'||(s.content&&s.content.includes('보강')); });
  var exams = get('bjm_exams').filter(function(e){ return e && (e.start||e.startDate); });
  var today = fmt(new Date());
  var weekAgo = fmt(new Date(Date.now()-7*86400000));
  var wk = att.filter(function(r){ return r.date>=weekAgo && !r.courseTag; });
  var present = wk.filter(function(r){ return r.status==='O'||r.status==='B'; }).length;
  var attRate = wk.length ? Math.round(present/wk.length*100)+'%' : '—';
  var hwMiss = [];
  hw.forEach(function(h){ if(h.status!=='done' && h.due && h.due>=today && hwMiss.indexOf(h.sid)<0) hwMiss.push(h.sid); });
  var upMakeup = schedules.filter(function(s){ return !s.done && s.date>=today; }).sort(function(a,b){ return a.date.localeCompare(b.date); }).slice(0,3);
  var upExam = exams.filter(function(e){ return (e.end||e.endDate||e.start||e.startDate)>=today; }).sort(function(a,b){ return (a.start||a.startDate).localeCompare(b.start||b.startDate); }).slice(0,3);
  var typeMap={mid:'중간',final:'기말',mock:'모의',other:'기타'};
  var html='<div class="stat-cards" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">'
    +'<div class="card" style="padding:14px;"><div style="font-size:11px;color:var(--muted);">재원생</div><div style="font-size:24px;font-weight:700;color:var(--navy);">'+students.length+'명</div></div>'
    +'<div class="card" style="padding:14px;"><div style="font-size:11px;color:var(--muted);">이번 주 출석률</div><div style="font-size:24px;font-weight:700;color:var(--green);">'+attRate+'</div></div>'
    +'<div class="card" style="padding:14px;"><div style="font-size:11px;color:var(--muted);">숙제 미제출(오늘 이후 마감)</div><div style="font-size:24px;font-weight:700;color:var(--red);">'+hwMiss.length+'명</div></div>'
    +'<div class="card" style="padding:14px;"><div style="font-size:11px;color:var(--muted);">예정 보강</div><div style="font-size:24px;font-weight:700;color:var(--gold);">'+upMakeup.length+'건</div></div>'
    +'</div>';
  html+='<div class="section-title">다가오는 보강</div><div class="card"><div class="card-body">'
    +(upMakeup.length?upMakeup.map(function(s){ return '<div style="padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;"><b>'+s.date+(s.time?' '+s.time:'')+'</b> · '+(s.content||s.name||'보강')+'</div>'; }).join(''):'<div class="empty" style="padding:14px 0;">예정된 보강 없음</div>')
    +'</div></div>';
  html+='<div class="section-title">다가오는 시험</div><div class="card"><div class="card-body">'
    +(upExam.length?upExam.map(function(e){ return '<div style="padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;"><b>'+(e.start||e.startDate)+'</b> · '+e.school+' '+(typeMap[e.type]||e.type||'')+'</div>'; }).join(''):'<div class="empty" style="padding:14px 0;">예정된 시험 없음</div>')
    +'</div></div>';
  document.getElementById('overview-body').innerHTML=html;
}

// ===== 출석 (달력 + 그날 학생별) =====
function renderAttendance(){
  var allAtt=get('bjm_attendance').filter(function(r){ return r && r.date && !r.courseTag; });
  var marks={}; allAtt.forEach(function(r){ marks[r.date]=true; });
  var sel=_cal.attendance.sel;
  var students=get('bjm_students').filter(isActive);
  var att=allAtt.filter(function(r){ return r.date===sel; });
  var byId={}; att.forEach(function(r){ byId[r.sid]=r.status; });
  var cnt={O:0,X:0,T:0,B:0,E:0,none:0};
  var sorted=students.slice().sort(function(a,b){ return (a.grade||'').localeCompare(b.grade||'')||(a.name||'').localeCompare(b.name||''); });
  var rows=sorted.map(function(s){
    var st=byId[s.id]; if(st&&cnt[st]!=null)cnt[st]++; else cnt.none++;
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);">'
      +'<span style="font-size:13px;">'+s.name+' <span style="color:var(--muted);font-size:11px;">'+(s.grade||'')+'</span></span>'
      +'<span style="font-weight:700;font-size:13px;color:'+(st?statusColor(st):'var(--muted)')+';">'+(st?STATUS_MAP[st]||st:'미입력')+'</span></div>';
  }).join('');
  var head='<div class="cal-detail-date">'+_dowLabel(sel)+'</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:10px;">출석 '+cnt.O+' · 지각 '+cnt.T+' · 결석 '+cnt.X+' · 보강 '+cnt.B+' · 미입력 '+cnt.none+'</div>';
  document.getElementById('attendance-body').innerHTML=buildCalendar('attendance',marks)+head+(rows||'<div class="empty">학생이 없습니다</div>');
}

// ===== 테스트 (달력 + 그날 점수) =====
function renderTests(){
  var students=get('bjm_students');
  var nameOf={}; students.forEach(function(s){ nameOf[s.id]=s.name; });
  var all=get('bjm_tests').filter(function(t){ return t && t.date; });
  var marks={}; all.forEach(function(t){ marks[t.date]=true; });
  var sel=_cal.tests.sel;
  var tests=all.filter(function(t){ return t.date===sel; })
    .sort(function(a,b){ return (b.score||0)-(a.score||0); });
  var detail;
  if(!tests.length){ detail='<div class="empty" style="padding:20px 0;">이 날 테스트 기록이 없어요</div>'; }
  else detail=tests.map(function(t){
    var sc=(t.score!=null?t.score+'점':(t.pending?'미채점':'—'));
    var col=t.score==null?'var(--muted)':(t.score>=90?'var(--green)':t.score>=70?'var(--gold)':'var(--red)');
    var numer=(t.fullScore!=null&&t.gotScore!=null)?' ('+t.gotScore+'/'+t.fullScore+')':'';
    return '<div class="card" style="padding:11px 13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;">'
      +'<div style="min-width:0;flex:1;"><div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+(nameOf[t.sid]||'—')+'</div>'
      +'<div style="font-size:11px;color:var(--muted);margin-top:2px;">'+(t.name||'')+'</div></div>'
      +'<div style="font-weight:700;font-size:15px;color:'+col+';flex-shrink:0;">'+sc+'<span style="font-size:10px;font-weight:400;color:var(--muted);">'+numer+'</span></div></div>';
  }).join('');
  document.getElementById('tests-body').innerHTML=buildCalendar('tests',marks)+'<div class="cal-detail-date">'+_dowLabel(sel)+'</div>'+detail;
}

// 학생 조회
function renderStudents(query){
  var students = get('bjm_students').filter(isActive);
  var groups = get('bjm_groups');
  if(query) students = students.filter(function(s){ return s.name.includes(query); });
  var el = document.getElementById('student-list');
  if(!students.length){ el.innerHTML='<div class="empty">학생이 없습니다</div>'; return; }
  el.innerHTML = students.map(function(s){
    var myGroups = groups.filter(function(g){ return (g.students||[]).includes(s.id); });
    return '<div class="student-item" onclick="showStudent(\''+s.id+'\')">'+
      '<div class="student-name">'+s.name+'</div>'+
      '<div class="student-meta">'+(s.grade||'')+(s.school?' · '+s.school:'')+'</div>'+
      '<div class="student-tags">'+
      myGroups.map(function(g){ return '<span class="tag tag-red">'+g.name+'</span>'; }).join('')+
      '</div></div>';
  }).join('');
}

function searchStudents(q){ renderStudents(q); }

function showStudent(sid){
  var students = get('bjm_students');
  var groups = get('bjm_groups');
  var att = get('bjm_attendance').filter(function(r){ return r.sid===sid; }).sort(function(a,b){ return b.date.localeCompare(a.date); });
  var hw = get('bjm_homework').filter(function(h){ return h.sid===sid && h.status==='pending'; });
  var s = students.find(function(x){ return x.id===sid; });
  if(!s) return;
  var myGroups = groups.filter(function(g){ return (g.students||[]).includes(sid); });
  document.getElementById('m-name').textContent = s.name;
  document.getElementById('m-meta').innerHTML = (s.grade||'')+(s.school?' · '+s.school:'')+'<br>'+(s.phone?'📞 '+s.phone:'');
  document.getElementById('m-groups').innerHTML = myGroups.length
    ? myGroups.map(function(g){ return '<span class="tag tag-red" style="margin-right:6px;margin-bottom:4px;display:inline-block;">'+g.name+'</span>'; }).join('')
    : '<span style="color:var(--muted);font-size:12px;">소속 반 없음</span>';
  var statusMap={'O':'출석','X':'결석','T':'지각','B':'보강','E':'조퇴'};
  document.getElementById('m-att').innerHTML = att.slice(0,5).map(function(r){
    return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px;">'+
      '<span>'+r.date+'</span><span style="font-weight:700;color:'+(r.status==='O'?'var(--green)':r.status==='X'?'var(--red)':'var(--gold)')+'">'+( statusMap[r.status]||r.status)+'</span></div>';
  }).join('') || '<div style="color:var(--muted);font-size:12px;padding:8px 0;">출결 기록 없음</div>';
  document.getElementById('m-hw').innerHTML = hw.length
    ? hw.map(function(h){ return '<div style="font-size:12px;padding:6px 0;border-bottom:1px solid var(--line);">'+h.name+(h.due?' (~'+h.due+')':'')+'</div>'; }).join('')
    : '<div style="color:var(--green);font-size:12px;padding:8px 0;">미제출 숙제 없음 🔥</div>';
  document.getElementById('student-modal').classList.add('open');
}

function closeModal(){
  document.getElementById('student-modal').classList.remove('open');
}

// 보강
function renderMakeup(){
  var schedules = get('bjm_schedules').filter(function(s){ return s.type==='보강'||s.content&&s.content.includes('보강'); });
  var today = fmt(new Date());
  var plan = schedules.filter(function(s){ return !s.done && s.date>=today; }).sort(function(a,b){ return a.date.localeCompare(b.date); });
  var done = schedules.filter(function(s){ return s.done || s.date<today; }).sort(function(a,b){ return b.date.localeCompare(a.date); }).slice(0,10);
  var planEl = document.getElementById('makeup-plan-list');
  var doneEl = document.getElementById('makeup-done-list');
  planEl.innerHTML = plan.length ? plan.map(function(s){
    return '<div class="makeup-item">'+
      '<div class="makeup-date">'+s.date+(s.time?' '+s.time:'')+'</div>'+
      '<div class="makeup-name">'+(s.content||s.name||'보강')+'</div>'+
      '<span class="makeup-status status-plan">예정</span></div>';
  }).join('') : '<div class="empty" style="padding:20px 0;">예정된 보강이 없습니다</div>';
  doneEl.innerHTML = done.length ? done.map(function(s){
    return '<div class="makeup-item">'+
      '<div class="makeup-date">'+s.date+(s.time?' '+s.time:'')+'</div>'+
      '<div class="makeup-name">'+(s.content||s.name||'보강')+'</div>'+
      '<span class="makeup-status status-done">완료</span></div>';
  }).join('') : '<div class="empty" style="padding:20px 0;">완료된 보강이 없습니다</div>';
}

// 시간표
function renderTimetable(){
  var classes = get('tt_classes');
  var el = document.getElementById('tt-list');
  if(!classes.length){ el.innerHTML='<div class="empty">시간표가 없습니다<br><small>수업 시간표 페이지에서 추가해주세요</small></div>'; return; }
  var byDay = {};
  ['월','화','수','목','금','토','일'].forEach(function(d){ byDay[d]=[]; });
  classes.forEach(function(c){
    (c.days||[]).forEach(function(d){ if(byDay[d]) byDay[d].push(c); });
  });
  el.innerHTML = ['월','화','수','목','금','토','일'].map(function(d){
    if(!byDay[d].length) return '';
    var sorted = byDay[d].sort(function(a,b){ return a.start.localeCompare(b.start); });
    return '<div class="tt-day">'+
      '<div class="tt-day-title">'+d+'요일</div>'+
      sorted.map(function(c){
        var bg = c.color ? c.color+'22' : 'var(--blue-bg)';
        var col = c.color||'var(--blue)';
        return '<div class="tt-class-card" style="background:'+bg+';border-left-color:'+col+';">'+
          '<div class="tt-class-name" style="color:'+col+'">'+c.name+'</div>'+
          '<div class="tt-class-info" style="color:'+col+'">'+c.start+' ~ '+c.end+(c.subject?' · '+c.subject:'')+'</div>'+
          (c.students&&c.students.length?'<div class="tt-class-info" style="color:'+col+'">'+c.students.join(', ')+'</div>':'')+
          '</div>';
      }).join('')+'</div>';
  }).join('');
}

// 시험일정
function renderExam(){
  var exams = get('bjm_exams');
  var today = fmt(new Date());
  exams = exams.filter(function(e){ return e && (e.start||e.startDate); });
  exams.sort(function(a,b){ return (a.start||a.startDate).localeCompare(b.start||b.startDate); });
  var typeMap = {mid:'중간고사',final:'기말고사',mock:'모의고사',other:'기타'};
  var el = document.getElementById('exam-list');
  if(!exams.length){ el.innerHTML='<div class="empty">등록된 시험 일정이 없습니다</div>'; return; }
  el.innerHTML = exams.map(function(e){
    var isPast = e.end < today;
    return '<div class="exam-item" style="opacity:'+(isPast?.5:1)+'">'+
      '<div class="exam-school">'+e.school+'</div>'+
      '<div class="exam-date">'+(e.start||e.startDate)+((e.end||e.endDate)&&(e.end||e.endDate)!==(e.start||e.startDate)?' ~ '+(e.end||e.endDate):'')+'</div>'+
      '<span class="exam-type" style="background:var(--blue-bg);color:var(--blue);">'+(typeMap[e.type]||e.type||'시험')+'</span>'+
      (e.memo?'<div style="font-size:11px;color:var(--muted);margin-top:4px;">'+e.memo+'</div>':'')+
      '</div>';
  }).join('');
}

// 플래너 (달력 + 그날 일정)
function renderPlanner(){
  var events = get('planner_events').filter(function(e){ return e && e.date; });
  var el = document.getElementById('planner-list');
  var marks={}; events.forEach(function(e){ marks[e.date]=true; });
  var sel=_cal.planner.sel;
  var TYPE_COLOR={'study':'var(--blue)','class':'var(--green)','admin':'var(--gold)','personal':'var(--navy)','prep':'var(--red)','studyprep':'var(--green)'};
  var TYPE_LABEL={'study':'스터디','class':'수업','admin':'행정','personal':'개인','prep':'수업준비','studyprep':'스터디 준비'};
  var day=events.filter(function(e){ return e.date===sel; }).sort(function(a,b){ return (a.time||'').localeCompare(b.time||''); });
  var detail;
  if(!day.length){ detail='<div class="empty" style="padding:20px 0;">이 날 일정이 없어요</div>'; }
  else detail=day.map(function(e){
    var col=TYPE_COLOR[e.type]||'var(--navy)';
    return '<div class="planner-event" style="border-left-color:'+col+';">'+
      '<div class="planner-event-title">'+(e.title||'')+'</div>'+
      '<div class="planner-event-meta">'+(e.time||'')+' · '+(TYPE_LABEL[e.type]||e.type||'')+(e.memo?' · '+e.memo.slice(0,30):'')+'</div>'+
      '</div>';
  }).join('');
  el.innerHTML=buildCalendar('planner',marks)+'<div class="cal-detail-date">'+_dowLabel(sel)+'</div>'+detail;
}

loadFromFirebase();
</script>
